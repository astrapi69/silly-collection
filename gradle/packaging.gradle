// The manifest names what was built and with which tools, and nothing that changes between two builds of the
// same commit: no build time, no operating system, no JDK patch level, which made a jar impossible to rebuild
// bit for bit from its tag (#99, as astrapi69/silly-strings#14 and astrapi69/file-worker#97). Which JDK builds a
// release is named in .sdkmanrc, where it can be checked; the manifest keeps the feature release as
// Build-Jdk-Spec, the attribute Maven writes for the same reason.
jar {
    manifest {
        attributes(
                "Name"                  : project.name,
                "Manifest-Version"      : project.version,
                "Implementation-Title"  : "$groupPackage" + "." + "$rootProject.name",
                "Implementation-Version": project.version,
                "Implementation-Vendor" : "$projectLeaderName",
                "Created-By"            : "Gradle ${gradle.gradleVersion}",
                "Built-By"              : "$projectLeaderName",
                "Build-Jdk-Spec"        : projectSourceCompatibility
        )
    }
}

// Every archive has fixed entry times and a fixed entry order, so that it depends on the files alone. Gradle 9
// does this by default; it is stated here so that the build does not depend on that default (#99).
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
