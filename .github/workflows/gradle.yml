# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

# the build reads the repository only; mutation testing runs in mutation-testing.yml
permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The JDK .sdkmanrc names, as the full semver of Adoptium: with '25' or '25.0.5' setup-java takes whatever
      # matches first, such as a later patch release from the runner image (#99, as astrapi69/silly-strings#14)
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25.0.5+8.0.LTS'
          distribution: 'temurin'
      - name: Check the JDK is the one .sdkmanrc names
        run: |
          # sdkman names Temurin 25.0.5+8 "25.0.5.0+8-tem", the JDK's release file "Temurin-25.0.5+8". The
          # build counts too: JAVA_VERSION, which this step read before, says 25.0.5 for every build of it
          # (#106, as astrapi69/silly-strings#70)
          candidate=$(sed -n 's/^java=\(.*\)-tem$/\1/p' .sdkmanrc)
          want="Temurin-${candidate/.0+/+}"
          have=$(sed -n 's/^IMPLEMENTOR_VERSION="\(.*\)"$/\1/p' "$JAVA_HOME/release")
          vendor=$(sed -n 's/^IMPLEMENTOR="\(.*\)"$/\1/p' "$JAVA_HOME/release")
          echo ".sdkmanrc names $candidate-tem, that is $want; set up: $vendor $have"
          [ -n "$candidate" ] && [ "$have" = "$want" ] && [ "$vendor" = "Eclipse Adoptium" ]
      - name: Setup Gradle
        # v5.0.2, not v6: from v6 the action bundles a proprietary caching component (the maintainer's decision F2, 2026-11-20).
        # v5.0.2 lies in the range of GHSA-chpw-2mqm-95cc (fixed in 6.4.1), which affects only the two-workflow
        # download-and-submit setup; this workflow generates and submits in one job. Do not switch to download-and-submit.
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Execute Gradle build
        run: ./gradlew build
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
