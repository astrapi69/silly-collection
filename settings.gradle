plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id "com.gradleup.nmcp.settings" version "1.6.2"
}
rootProject.name = "silly-collection"

nmcpSettings {
    centralPortal {
        // Generate a user token at https://central.sonatype.com/ (Account -> Generate User Token).
        // This is NOT the legacy OSSRH username/password - the Portal Publisher API requires a
        // dedicated token pair.
        username = System.getenv("CENTRAL_PORTAL_TOKEN_USERNAME") ?: ""
        password = System.getenv("CENTRAL_PORTAL_TOKEN_PASSWORD") ?: ""
        // a release waits in the Central Portal until the maintainer publishes it there, as in the
        // rest of the family (#31)
        publishingType = "USER_MANAGED"
    }
}
