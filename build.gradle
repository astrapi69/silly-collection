buildscript {
    repositories {
        maven {
            url = projectRepositoriesMavenUrl
        }
    }
}

plugins {
    id 'jacoco'
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    alias(libs.plugins.gradle.versions.plugin)
    alias(libs.plugins.spotless.plugin.gradle)
    alias(libs.plugins.versionCatalogUpdate)
    alias(libs.plugins.pitest.gradle.plugin)
}

group = "$groupPackage" as Object
version = "$projectVersion" as Object
description = "$rootProject.name"

// import gradle files
apply from: "gradle/apply-gradle-files.gradle"

// Mutation-score floor the workflow "Mutation testing" fails below: it runs `./gradlew pitest` on
// GitHub (.github/workflows/mutation-testing.yml, #98); PIT rounds the score half up to a whole
// percent before it compares, and holds it at 99 while a mutant survives. Measured
// 97.5 % (703 of 721 mutants killed) on 2026-11-04 (#36). The floor is that score minus about two
// points, rounded down: a few mutants more that survive, such as those of a new method whose tests
// are not complete yet, do not fail the run at once, a drop of more than about two points does.
// With the 721 mutants of today it fails from 40 survivors on; 18 survive, 14 of them equivalent,
// the other 4 point at bugs and at Javadoc that contradicts the code (#41, #43, #47).
// Kept here, not in gradle/mutation-testing.gradle, so that the floor sits in the file a reader
// (and awesome-well-tested's check) looks at.
pitest {
    mutationThreshold = 95
}

java {
    sourceCompatibility = "$projectSourceCompatibility" as Object
    toolchain {
        languageVersion = JavaLanguageVersion.of("$projectSourceCompatibility")
    }
}

tasks.withType(JavaCompile).configureEach { javaCompiler ->
    options.encoding = "UTF-8"
    // --release records the feature release of java.base in module-info.class (requires java.base 25), where
    // javac would otherwise write the version of the JDK it runs on (25.0.5), and the jar would differ with
    // the JDK's patch level (#99, as astrapi69/silly-strings#14)
    options.release = Integer.parseInt("$projectSourceCompatibility")
    // uncomment the next line for build with compiler argument -Xlint:deprecation
    // options.compilerArgs << "-Xlint:deprecation"
    // uncomment the next line for build with compiler argument -Xlint:unchecked
    // options.compilerArgs << "-Xlint:unchecked"
}

// The module lints of javac on the main sources, as errors: exports reports a public signature whose type
// belongs to a module that module-info.java requires without transitive, which is how MapFactory lost
// silly-bean's KeyValuePair for a consumer's compiler up to 29.0 (#95); module, opens, requires-automatic and
// requires-transitive-automatic are clean today. They look at this module's own declarations only, so a
// dependency update does not raise them. Not -Xlint:all: it reports 90 warnings (varargs, dangling-doc-comments,
// serial), each category its own question (#134). The tests are not compiled with it, they are no module.
tasks.named("compileJava") {
    options.compilerArgs += ["-Xlint:exports,module,opens,requires-automatic,requires-transitive-automatic",
                             "-Werror"]
}

apply from: "gradle/test-results-complete.gradle"
